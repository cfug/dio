name: Verify packages abilities

on:
  push:
    branches:
      - main
      - '6.0.0'
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
      - '6.0.0'
    paths-ignore:
      - "**.md"

# Ensure that new pushes/updates cancel running jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Disable permissions for all of the available permissions
permissions: {}

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  workflows:
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        sdk: [ min, stable, beta ]
    env:
      TEST_PRESET: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #v2.23.0
        with:
          cache: true
          flutter-version: ${{ case(matrix.sdk == 'min', '3.3.0', '') }}
          channel: ${{ case(matrix.sdk == 'min', '', matrix.channel) }}
      - run: |
          echo "TARGET_DART_SDK=$TARGET_DART_SDK" >> $GITHUB_ENV
        env:
          TARGET_DART_SDK: ${{ matrix.sdk }}
      - name: Prepare dependencies for the project management
        run: dart pub get
      - uses: bluefireteam/melos-action@2982f8e4fc92440a219490009d6d05195cb1a6a5 #v3.8.0
        with:
          run-bootstrap: false
          melos-version: ${{ case(matrix.sdk == 'min', '3.4.0', '^6.0.0') }}
      - name: Remove dio_web_adapter overrides
        if: ${{ matrix.sdk == 'min' }}
        run: rm -rf plugins/web_adapter
      - name: Check satisfied packages
        run: |
          dart ./scripts/melos_packages.dart
          echo $(cat .melos_packages) >> $GITHUB_ENV
      - name: Melos Bootstrap
        run: melos bootstrap
      - name: '[Verify step] Format'
        if: ${{ matrix.sdk == 'stable' }}
        run: melos run format
      - name: '[Verify step] Analyze packages'
        if: ${{ matrix.sdk == 'stable' }}
        run: melos run analyze
      - name: '[Verify step] Publish dry-run'
        if: ${{ matrix.sdk == 'stable' }}
        run: melos run publish-dry-run
      # Tests
      - name: Install proxy for tests
        run: sudo apt-get update && sudo apt-get install -y squid mkcert
      - name: Start local httpbun
        run: |
          mkcert -install
          mkcert -cert-file '/tmp/cert.pem' -key-file '/tmp/key.pem' httpbun.local
          echo '127.0.0.1 httpbun.local' | sudo tee --append /etc/hosts
          docker run \
            --name httpbun \
            --detach \
            --publish 443:443 \
            --volume /tmp:/tmp:ro \
            --env HTTPBUN_TLS_CERT=/tmp/cert.pem \
            --env HTTPBUN_TLS_KEY=/tmp/key.pem \
            --pull always \
            sharat87/httpbun
          docker run \
            --name httpbun-http \
            --detach \
            --publish 80:80 \
            --pull always \
            sharat87/httpbun
          sleep 1
          curl --fail --silent --show-error https://httpbun.local/any
          curl --fail --silent --show-error http://httpbun.local/any
      - name: Prepare pinning certificates
        run: HTTPBUN_HOST=httpbun.local ./scripts/prepare_pinning_certs.sh
      - name: Use httpbun.local for tests
        run: melos run httpbun:local
      - name: '[Verify step] Test Dart packages [VM]'
        run: melos run test:vm
      - name: Use local HTTP for Web/Flutter tests
        run: melos run httpbun:local:http
      - name: '[Verify step] Test Dart packages [Chrome]'
        run: melos run test:web:chrome
      - name: '[Verify step] Test Dart packages [Firefox]'
        run: melos run test:web:firefox
      - name: '[Verify step] Test Flutter packages'
        run: melos run test:flutter
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        if: ${{ matrix.sdk == 'stable' }}
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: '[Verify step] Build Flutter APK'
        if: ${{ matrix.sdk == 'stable' }}
        run: melos run build:example:apk
      # Coverage
      - name: '[Coverage] Format & print test coverage'
        if: ${{ matrix.sdk == 'stable' }}
        run: melos run coverage:show
      - name: '[Coverage] Create Report'
        uses: clearlyip/code-coverage-report-action@110af9d4ec87b6706f182fd90e3102af9e5203bf #v7.0.0
        id: code_coverage_report
        if: ${{ matrix.sdk == 'stable' && github.actor != 'dependabot[bot]'}}
        with:
          artifact_download_workflow_names: 'Verify packages abilities,coverage_baseline'
          filename: 'coverage/cobertura.xml'
          only_list_changed_files: true
      - name: '[Coverage] Write PR number to file'
        if: ${{ matrix.sdk == 'stable' && github.actor != 'dependabot[bot]'}}
        run: echo "$EVENT_NUMBER" > pr_number.txt
        env:
          EVENT_NUMBER: ${{ github.event.number }}
      - name: '[Coverage] Upload'
        if: ${{ matrix.sdk == 'stable' && github.actor != 'dependabot[bot]'}}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: code-coverage-results
          path: |
            coverage/cobertura.xml
            code-coverage-results.md
            pr_number.txt
          retention-days: 7

  coverage_comment:
    runs-on: ubuntu-latest
    needs: workflows
    if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - name: Download coverage artifact
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: code-coverage-results
          path: .coverage
        continue-on-error: true

      - name: Check if artifact exists
        id: check
        run: |
          if [[ -f .coverage/pr_number.txt ]]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Read PR number
        if: steps.check.outputs.exists == 'true'
        id: pr
        run: |
          PR_NUM=$(cat .coverage/pr_number.txt)
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
      - name: Call coverage_comment workflow
        if: steps.check.outputs.exists == 'true'
        uses: ./.github/workflows/coverage_comment.yml
        with:
          pr_number: ${{ steps.pr.outputs.pr_number }}
          coverage_report_file: .coverage/code-coverage-results.md
